        <nav class="nav">
          <a href="inicio.html">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"

            >
              <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />

          </a>
          <a href="calendario.html">

            >
              <rect width="18" height="18" x="3" y="4" rx="2" />

            </svg>

          <a href="notificacoes.html">
            <svg
              class="icon"

              stroke-width="2"
            >
              <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
              <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />

            Notificações
          </a>
          <a class="active" href="criar-evento.html">
            <svg
              class="icon"
              viewBox="0 0 24 24"

            >
              <circle cx="12" cy="12" r="10" />

            Criar Evento

          <a href="perfil.html">

        </nav>
        <div class="sidebar-foot">
          <div class="user-chip">
            <div class="avatar">AS</div>
            <div><strong>Ana Souza</strong><small>Discente</small></div>
          </div>
          <a class="logout" href="index.html">Sair</a>
        </div>
      </aside>
      <main class="main">
        <header class="page-head">
          <div>
            <h1>Criar evento</h1>
            <p>Preencha os dados do evento acadêmico</p>
          </div>
        </header>
        <form class="event-form" data-event-form>
          <div class="field event-field">
            <label for="event-title">Título do evento</label>
            <input
              id="event-title"
              name="title"
              type="text"
              placeholder="Ex: Workshop de Inteligência Artificial"
              required
            />
          </div>

          <div class="field event-field">
            <label for="event-description">Descrição</label>
            <textarea
              id="event-description"
              name="description"
              placeholder="Descreva o evento..."
              rows="4"
              required
            ></textarea>
          </div>

          <div class="event-form-grid">
            <div class="field event-field">
              <label>Data</label>
              <div class="custom-date-picker">
                <div class="date-picker-grid">
                  <select id="event-date-day" class="picker-input" aria-label="Dia" required>
                    <option value="">Dia</option>
                  </select>
                  <select id="event-date-month" class="picker-input" aria-label="Mês" required>
                    <option value="">Mês</option>
                  </select>
                  <select id="event-date-year" class="picker-input" aria-label="Ano" required>
                    <option value="">Ano</option>
                  </select>
                </div>
                <input id="event-date" name="date" type="hidden" required />
              </div>
            </div>
            <div class="field event-field">
              <label for="event-time">Horário</label>
              <div class="custom-time-picker">
                <input
                  id="event-time"
                  name="time"
                  type="time"
                  required
                />
              </div>
            </div>
          </div>

          <div class="field event-field">
            <label for="event-location">Local</label>
            <input
              id="event-location"
              name="location"
              type="text"
              placeholder="Ex: Auditório Principal"
              required
            />
          </div>

          <fieldset class="field event-field support-field">
            <legend>Necessidade de suporte de terceiros</legend>
            <div class="choice-grid">
              <label class="choice support-choice">
                <input type="radio" name="support" value="yes" required />
                <span>Sim</span>
              </label>
              <label class="choice support-choice">
                <input type="radio" name="support" value="no" />
                <span>Não</span>
              </label>
            </div>
          </fieldset>

          <div id="support-details-wrap" class="field event-field hidden-support-details">
            <label for="support-details">Tipo de colaboração necessária</label>
            <textarea
              id="support-details"
              name="supportDetails"
              rows="3"
              placeholder="Descreva o tipo de colaboração, ajuda ou apoio que o evento precisa..."
            ></textarea>
          </div>

          <div class="field event-field">
            <label for="event-spots">Vagas disponíveis</label>
            <input id="event-spots" name="spots" type="number" min="1" placeholder="50" required />
          </div>

          <div class="event-actions">
            <a class="btn btn-secondary" href="inicio.html">Cancelar</a>
            <button class="btn" type="submit">Publicar Evento</button>
          </div>
        </form>
      </main>
    </div>
    <script>
      const supportFields = document.querySelectorAll('input[name="support"]');
      const supportDetailsWrap = document.getElementById('support-details-wrap');
      const supportDetailsInput = document.getElementById('support-details');
      const dateDaySelect = document.getElementById('event-date-day');
      const dateMonthSelect = document.getElementById('event-date-month');
      const dateYearSelect = document.getElementById('event-date-year');
      const dateHiddenInput = document.getElementById('event-date');

      function generateDateOptions() {
        const currentYear = new Date().getFullYear();
        const monthOptions = [
          { value: '1', label: 'Jan' },
          { value: '2', label: 'Fev' },
          { value: '3', label: 'Mar' },
          { value: '4', label: 'Abr' },
          { value: '5', label: 'Mai' },
          { value: '6', label: 'Jun' },
          { value: '7', label: 'Jul' },
          { value: '8', label: 'Ago' },
          { value: '9', label: 'Set' },
          { value: '10', label: 'Out' },
          { value: '11', label: 'Nov' },
          { value: '12', label: 'Dez' },
        ];

        monthOptions.forEach(({ value, label }) => {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = label;
          dateMonthSelect.appendChild(option);
        });

        for (let year = currentYear; year <= currentYear + 3; year += 1) {
          const option = document.createElement('option');
          option.value = String(year);
          option.textContent = String(year);
          dateYearSelect.appendChild(option);
        }

        for (let day = 1; day <= 31; day += 1) {
          const option = document.createElement('option');
          option.value = String(day);
          option.textContent = String(day).padStart(2, '0');
          dateDaySelect.appendChild(option);
        }
      }

      function updateDateValue() {
        const day = dateDaySelect.value;
        const month = dateMonthSelect.value;
        const year = dateYearSelect.value;

        if (!day || !month || !year) {
          dateHiddenInput.value = '';
          return;
        }

        const monthNumber = String(month).padStart(2, '0');
        const dayNumber = String(day).padStart(2, '0');
        dateHiddenInput.value = `${year}-${monthNumber}-${dayNumber}`;
      }

      function updateDayOptions() {
        const dayValue = dateDaySelect.value;
        const selectedMonth = Number(dateMonthSelect.value || 1);
        const selectedYear = Number(dateYearSelect.value || new Date().getFullYear());
        const maxDay = new Date(selectedYear, selectedMonth, 0).getDate();

        const currentOptions = [...dateDaySelect.options].slice(1);
        currentOptions.forEach((option) => option.remove());

        for (let day = 1; day <= maxDay; day += 1) {
          const option = document.createElement('option');
          option.value = String(day);
          option.textContent = String(day).padStart(2, '0');
          dateDaySelect.appendChild(option);
        }

        if (Number(dayValue) <= maxDay) {
          dateDaySelect.value = String(dayValue);
        } else {
          dateDaySelect.value = '';
        }
      }

      function toggleSupportDetails() {
        const checkedValue = document.querySelector('input[name="support"]:checked')?.value;

        if (checkedValue === 'yes') {
          supportDetailsWrap.classList.add('visible');
          supportDetailsInput.setAttribute('required', 'required');
        } else {
          supportDetailsWrap.classList.remove('visible');
          supportDetailsInput.removeAttribute('required');
          supportDetailsInput.value = '';
        }
      }

      dateDaySelect.addEventListener('change', updateDateValue);
      dateMonthSelect.addEventListener('change', () => {
        updateDayOptions();
        updateDateValue();
      });
      dateYearSelect.addEventListener('change', () => {
        updateDayOptions();
        updateDateValue();
      });
      supportFields.forEach((field) => {
        field.addEventListener('change', toggleSupportDetails);
      });

      generateDateOptions();
      updateDayOptions();
      toggleSupportDetails();
    </script>
  </body>
</html>
