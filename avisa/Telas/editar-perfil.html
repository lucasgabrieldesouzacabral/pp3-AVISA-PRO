<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar perfil — AVISA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,700&family=Outfit:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="logo" href="inicio.html" aria-label="AVISA">
          <span class="logo-mark">A</span>
          <span class="logo-word">avisa<span>!</span></span>
        </a>
        <nav class="nav" aria-label="Navegação principal">
          <a href="inicio.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></svg>Início</a>
          <a href="calendario.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></svg>Calendário</a>
          <a href="notificacoes.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg>Notificações</a>
          <a href="criar-evento.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M8 12h8" /><path d="M12 8v8" /></svg>Criar Evento</a>
          <a class="active" href="perfil.html"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>Perfil</a>
        </nav>
        <div class="sidebar-foot">
          <div class="user-chip">
            <div class="avatar">{{INICIAIS_USUARIO}}</div>
            <div><strong>{{NOME_USUARIO}}</strong><small>{{TIPO_USUARIO}}</small></div>
          </div>
          <a class="logout" href="index.html">Sair</a>
        </div>
      </aside>

      <main class="main">
        <header class="page-head">
          <div>
            <h1>Editar perfil</h1>
            <p>Atualize suas informações pessoais e acadêmicas.</p>
          </div>
        </header>

        <form class="profile-card profile-form-card event-form" data-profile-form>
          <div class="field event-field">
            <label for="profile-name">Nome completo</label>
            <input id="profile-name" name="nome_completo" type="text" value="{{EDIT_PROFILE_NOME}}" autocomplete="name" required />
          </div>
          <div class="field event-field">
            <label for="profile-email">E-mail institucional</label>
            <input id="profile-email" name="email_institucional" type="email" value="{{EDIT_PROFILE_EMAIL}}" autocomplete="email" required />
          </div>
          <div class="field event-field">
            <label for="profile-registration">Matrícula</label>
            <input id="profile-registration" name="matricula" type="text" value="{{EDIT_PROFILE_MATRICULA}}" autocomplete="off" />
          </div>
          <div class="field event-field">
            <label for="profile-specific">{{DADO_ESPECIFICO_ROTULO}}</label>
            <input id="profile-specific" name="{{DADO_ESPECIFICO_CHAVE}}" type="text" value="{{EDIT_PROFILE_DADO}}" required />
          </div>
          <p class="form-note">Tipo de usuário: <strong>{{EDIT_PROFILE_TIPO}}</strong>. Para alterá-lo, fale com a administração.</p>
          <div class="form-actions">
            <a class="btn btn-secondary" href="perfil.html">Cancelar</a>
            <button class="btn" type="submit">Salvar alterações</button>
          </div>
        </form>
      </main>
    </div>
  </body>
</html>
